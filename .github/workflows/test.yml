name: tests

# Pull-request and branch CI: tests only. This workflow never receives secrets
# and never sends anything. The publisher (pulse.yml) runs on schedule /
# workflow_dispatch only and can never be triggered by a pull request.
on:
  pull_request:
  push:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/worker.test.js
